name: Avalynpharma
description: 'Avalyn Pharma is a clinical-stage biotechnology company developing inhaled therapies for
  rare and serious respiratory diseases, with a focus on idiopathic pulmonary fibrosis (IPF) and other
  interstitial lung diseases. Its inhaled-delivery pipeline includes AP01 (inhaled pirfenidone), AP02
  (inhaled nintedanib), and AP03 (a fixed-dose combination), aiming to deliver antifibrotic medication
  directly to lung tissue to improve efficacy while reducing systemic side effects. Backed by Norwest
  Venture Partners, the company is a therapeutics developer and publishes no public API or developer
  surface; this profile is maintained in the API Evangelist network as a company record.'
